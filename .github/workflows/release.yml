name: 🚀 Build & Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: 🌐 Package Web Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip the web game
        run: |
          mkdir -p dist
          zip -r dist/2048-web-game.zip \
            index.html \
            manifest.json \
            Web-Version/ \
            --exclude "*.git*"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-game
          path: dist/2048-web-game.zip

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x Android-Version/Game2048/gradlew

      - name: Build debug APK
        working-directory: Android-Version/Game2048
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp Android-Version/Game2048/app/build/outputs/apk/debug/app-debug.apk \
             dist/2048-game-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/2048-game-android.apk

  build-ios:
    name: 🍎 Build iOS Simulator App
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Select and boot an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project "2048 Game.xcodeproj" -scheme "Game-2048" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath build \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip the .app bundle
        run: |
          mkdir -p dist
          APP_PATH=$(find build -name "Game-2048.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -1)
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/dist/2048-ios-simulator.zip" "$(basename "$APP_PATH")"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: dist/2048-ios-simulator.zip

  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-android, build-ios]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-game
          path: dist/

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-app
          path: dist/

      - name: Zip docs
        run: zip -r dist/2048-docs.zip docs/ --exclude "*.git*" || true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "Release ${{ steps.tag.outputs.TAG }}"
          body: |
            ## 🎮 2048 Game — ${{ steps.tag.outputs.TAG }}
            | File | Description |
            |------|-------------|
            | `2048-web-game.zip` | Web version — open index.html offline |
            | `2048-game-android.apk` | Android APK — install on your phone |
            | `2048-ios-simulator.zip` | iOS Simulator app for Mac |
            | `2048-docs.zip` | Documentation |
            | `checksums.txt` | SHA-256 hashes |
          files: |
            dist/2048-web-game.zip
            dist/2048-game-android.apk
            dist/2048-ios-simulator.zip
            dist/2048-docs.zip
            dist/checksums.txt
          draft: false
          prerelease: false
